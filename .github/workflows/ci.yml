# =============================================================================
#  GitHub Actions — CI Pipeline
#  Triggers: push to main
#
#  Jobs (run in this order):
#  ┌──────────────────┐   ┌──────────────────────┐
#  │  test-python     │   │  build-test-java      │
#  │  (flake8 lint)   │   │  (mvn test + package) │
#  └────────┬─────────┘   └──────────┬────────────┘
#           │                        │
#           └──────────┬─────────────┘
#                      ▼
#           ┌──────────────────────┐
#           │  build-push-images   │
#           │  (GHCR push × 3)     │
#           └──────────────────────┘
# =============================================================================

name: CI

on:
  push:
    branches: [ "main" ]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# ── Top-level env ──────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==============================================================================
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Python linting
  # ────────────────────────────────────────────────────────────────────────────
  test-python:
    name: "🐍 Lint · mock-storefront (flake8)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mock-storefront

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # Cache pip downloads keyed on requirements.txt for faster runs
          cache: pip
          cache-dependency-path: mock-storefront/requirements.txt

      - name: Install runtime deps + flake8
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8
        run: |
          flake8 app/ \
            --count \
            --statistics \
            --format="::error file=%(path)s,line=%(row)d,col=%(col)d::%(text)s"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Java build & test
  # ────────────────────────────────────────────────────────────────────────────
  build-test-java:
    name: "☕ Build & Test · log-collector (Maven)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: log-collector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn clean test -B -Dstyle.color=always

      - name: Package uber-JAR (skip tests — already ran above)
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: log-collector-jar
          path: log-collector/target/log-collector.jar
          retention-days: 1    

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Build Docker images & push to GHCR
  # Runs only when BOTH test jobs succeed.
  # ────────────────────────────────────────────────────────────────────────────
  build-push-images:
    name: "🐳 Build & Push Images → GHCR"
    runs-on: ubuntu-latest
    needs: [ test-python, build-test-java ]

    # GITHUB_TOKEN needs write access to push packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Retrieve the pre-built JAR from Job 2 ──────────────────────────────
      - name: Download log-collector JAR
        uses: actions/download-artifact@v4
        with:
          name: log-collector-jar
          path: log-collector/target/

      # ── Docker Buildx (enables layer caching & multi-platform support) ──────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to GitHub Container Registry ─────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive image tags ───────────────────────────────────────────────────
      # repo_lower: GHCR requires the repository path to be lowercase
      - name: Compute image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)"            >> "$GITHUB_OUTPUT"
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
               >> "$GITHUB_OUTPUT"

      # ── Build & push: log-collector ─────────────────────────────────────────
      - name: Build & push log-collector
        uses: docker/build-push-action@v6
        with:
          context: ./log-collector
          file: ./log-collector/Dockerfile
          push: true
          # Two tags: immutable SHA pin + floating `latest`
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}/log-collector:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}/log-collector:${{ steps.meta.outputs.sha_short }}
          # GitHub Actions cache backend — shares cache across workflow runs
          cache-from: type=gha,scope=log-collector
          cache-to:   type=gha,scope=log-collector,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Build & push: mock-storefront ───────────────────────────────────────
      - name: Build & push mock-storefront
        uses: docker/build-push-action@v6
        with:
          context: ./mock-storefront
          file: ./mock-storefront/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}/mock-storefront:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}/mock-storefront:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=mock-storefront
          cache-to:   type=gha,scope=mock-storefront,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

     
      - name: Build & push analytics-dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./analytics-dashboard
          file: ./analytics-dashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://log-collector:8080' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}/analytics-dashboard:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}/analytics-dashboard:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=analytics-dashboard
          cache-to:   type=gha,scope=analytics-dashboard,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Print pushed image digest summary ───────────────────────────────────
      - name: Summarise pushed images
        run: |
          echo "## 🚀 Images pushed to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tags |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| log-collector | \`latest\`, \`${{ steps.meta.outputs.sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mock-storefront | \`latest\`, \`${{ steps.meta.outputs.sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| analytics-dashboard | \`latest\`, \`${{ steps.meta.outputs.sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** \`ghcr.io/${{ steps.meta.outputs.repo_lower }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
