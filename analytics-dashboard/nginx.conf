# nginx.conf — Hardened configuration for serving the Vite SPA
#
# Key decisions:
#   • try_files $uri $uri/ /index.html — handles client-side React Router paths
#   • gzip enabled for JS/CSS/JSON to reduce transfer size
#   • Cache-Control headers: immutable for hashed assets, no-cache for index.html
#   • Security headers: X-Frame-Options, X-Content-Type-Options, CSP

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin"        always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://log-collector:8080 http://localhost:8080; img-src 'self' data:;"
        always;

    # ── Static assets — long-lived cache (Vite adds content hashes) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires     1y;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        try_files   $uri =404;
    }

    # ── index.html — never cache (force fresh check on every load) ───────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── SPA fallback — all other routes serve index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health probe for Docker / load balancer ──────────────────────────────
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
