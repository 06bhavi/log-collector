# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Application name ─────────────────────────────────────────────────────────
spring.application.name=log-collector

# ── Jackson / JSON serialisation ────────────────────────────────────────────
# Fail gracefully on unknown JSON properties instead of throwing an error
spring.jackson.deserialization.fail-on-unknown-properties=false
# Write dates as ISO-8601 strings, not epoch numbers
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.devops.logcollector=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ── HDFS ─────────────────────────────────────────────────────────────────────
# Default values work inside Docker on ecommerce-net.
# Override via environment variables: HDFS_URI and HDFS_LOG_PATH
hdfs.uri=${HDFS_URI:hdfs://namenode:9000}
hdfs.log.path=${HDFS_LOG_PATH:/logs/ecommerce_data.json}
